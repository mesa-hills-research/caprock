[package]
name = "mhr_vector_bench"
description = "Host tooling for mhr_vector: the benchmark harness (datasets, ground truth, build/query/update/open measurements, the speed score) and the conformance runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mhr_vector_bench"
path = "src/main.rs"

[[bin]]
name = "mhr_vector_conform"
path = "src/bin/mhr_vector_conform.rs"

[dependencies]
mhr_vector = { path = "../mhr_vector" }
mhr_vector_oracle = { path = "../mhr_vector_oracle" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
